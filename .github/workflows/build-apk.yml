
name: Build MS BROOM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o MS_BROOM_Android_Project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      

      
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      
     

      - name: Locate Gradle project
        run: find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MS-BROOM-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
          
